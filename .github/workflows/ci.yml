name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install cryptography pyyaml

      - name: Allow same-user process memory reads
        # The live tests spawn the core and hunt it from a sibling process.
        # default Ubuntu runners set Yama ptrace_scope=1, which blocks that.
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Unit and live tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build the Windows core
        run: dotnet build src/core/sl33p.csproj -c Release -v q

      - name: Verify script
        run: python tools/verify.py
