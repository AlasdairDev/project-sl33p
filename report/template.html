<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sl33p report</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 28px 36px;
    background: #ffffff;
    color: #1c1c1c;
    font: 13px/1.55 "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  main { max-width: 1240px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 26px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #d6d6d6;
    color: #333;
  }
  .meta { color: #666; font-size: 12px; margin-bottom: 18px; }
  code { color: #111; }
  .cards { display: flex; flex-wrap: wrap; gap: 28px; margin: 6px 0 2px; }
  .card { min-width: 0; }
  .card-label { display: block; color: #666; font-size: 11px; }
  .card-value { display: block; font-size: 15px; }
  .chips { margin: 12px 0 0; }
  .chip {
    display: inline-block;
    border: 1px solid #d6d6d6;
    border-radius: 3px;
    padding: 1px 7px;
    margin: 0 6px 6px 0;
    font-size: 11px;
    color: #555;
  }
  .chip-off { color: #b00020; border-color: #e0b4ba; }
  table { width: 100%; border-collapse: collapse; border: 1px solid #c9c9c9; }
  th, td {
    text-align: left;
    padding: 6px 9px;
    border-bottom: 1px solid #dcdcdc;
    vertical-align: top;
  }
  th { background: #f3f3f3; color: #333; font-size: 11px; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td code { word-break: break-word; }
  .badge { font-size: 11px; }
  .badge.ok { color: #0a6b2d; }
  .badge.bad { color: #b00020; }
  .empty { color: #666; border: 1px solid #d6d6d6; padding: 10px; }
  .note { color: #666; font-size: 12px; margin: 8px 0 0; }
  footer {
    margin-top: 30px;
    color: #666;
    font-size: 11px;
    border-top: 1px solid #d6d6d6;
    padding-top: 10px;
  }
  footer strong { color: #333; }
</style>
</head>
<body>
<main>
  <h1>sl33p lab report</h1>
  <div class="meta"><!--SL33P:META--></div>

  <div class="cards"><!--SL33P:SUMMARY--></div>
  <div class="chips"><!--SL33P:CHIPS--></div>

  <!--SL33P:MATRIX-->
  <!--SL33P:FINDINGS-->
  <!--SL33P:REGIONS-->

  <footer>
    <strong>Lab only.</strong> One benign, self-owned process in an isolated lab. The
    technique covers a heap region, not call-stack or APC obfuscation. No third-party
    process, network connection or persistence is involved. See <code>docs/scope.md</code>.
  </footer>
</main>
</body>
</html>
